<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Sara English — Живой урок английского</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F1EEE8;
  --surface:#FFFFFF;
  --ink:#23252B;
  --muted:#8B8577;
  --line:#E3DFD5;
  --sara:#24457A;
  --sara-bubble:#EAF0F9;
  --sara-border:#D8E3F3;
  --felix-bubble:#FFFFFF;
  --live:#2E7D5B;
  --live-soft:#E6F2EC;
  --think:#A9762B;
  --think-soft:#F6EEDD;
  --speak:#24457A;
  --speak-soft:#EAF0F9;
  --danger:#B3402F;
  --ring-track:#E6E2D8;
  --radius:14px;
  --shadow:0 1px 2px rgba(35,37,43,.05),0 4px 16px rgba(35,37,43,.05);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  font-family:'Inter',system-ui,sans-serif;
  background:var(--bg);
  color:var(--ink);
  font-size:15px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer;border:none;background:none}
button:focus-visible,a:focus-visible{outline:2px solid var(--sara);outline-offset:2px;border-radius:6px}

/* ══════════ LAYOUT ══════════ */
.app{display:flex;height:100dvh;overflow:hidden}
.rail{
  width:312px;flex-shrink:0;
  border-right:1px solid var(--line);
  padding:28px 24px;
  display:flex;flex-direction:column;gap:18px;
  background:var(--bg);
}
.stage{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--bg)}

/* ══════════ CONNECTION BANNER ══════════ */
.banner{
  display:none;align-items:center;gap:10px;
  background:#FBEFEA;border-bottom:1px solid #EFD4CA;
  color:#8C3C2D;padding:9px 20px;font-size:13px;font-weight:500;
}
.banner.show{display:flex}
.banner .dot{width:8px;height:8px;border-radius:50%;background:var(--danger);animation:pulse 1.2s infinite}
.banner button{margin-left:auto;color:#8C3C2D;font-weight:600;font-size:13px;text-decoration:underline}

/* ══════════ RAIL: IDENTITY ══════════ */
.wordmark{font-family:'Playfair Display',serif;font-size:30px;font-weight:700;letter-spacing:-.01em}
.tagline{color:var(--muted);font-size:13px;margin-top:2px}

/* ══════════ SIGNATURE: AVATAR + PROGRESS RING ══════════ */
.avatar-wrap{position:relative;width:216px;height:216px;margin:6px auto 0}
.ring{position:absolute;inset:0;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:5}
.ring .track{stroke:var(--ring-track)}
.ring .fill{
  stroke:var(--live);stroke-linecap:round;
  stroke-dasharray:640;stroke-dashoffset:640;
  transition:stroke-dashoffset .8s ease,stroke .4s ease;
}
.avatar{
  position:absolute;inset:14px;border-radius:50%;
  overflow:hidden;background:linear-gradient(150deg,#3A5A8C 0%,#1E3055 100%);
  display:flex;align-items:center;justify-content:center;
  box-shadow:var(--shadow);
}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
/* Beat video (HeyGen MP4, 9:16, circle already baked in on a near-white
   bg, occupying roughly the vertical center of the tall frame). We do
   NOT add border-radius here — the .avatar parent already clips to a
   circle via overflow:hidden. object-fit:cover matches the video's
   width to this square, which centers a 720px-tall window vertically
   (near enough to the baked circle's own center to need no manual
   object-position offset). The extra scale(1.24) zooms past the video's
   own white padding so the baked circle's edge fills the square exactly
   — this is what makes it match the static portrait's size/position and
   avoids a visible white ring inside the mask. Hidden by default. */
.avatar video.beat{
  position:absolute;inset:0;width:100%;height:100%;
  object-fit:cover;object-position:50% 50%;
  transform:scale(1.24);
  display:none;
}
.avatar span{font-family:'Playfair Display',serif;color:#EAF0F9;font-size:72px;font-weight:600}
/* Ring is progress-arc only (option A: pulse/ripple removed for good).
   .fill stroke color still reflects speaking state, but no animation. */
.avatar-wrap.speaking .fill{stroke:var(--speak)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.avatar-wrap button.interrupt{
  position:absolute;bottom:-2px;left:50%;transform:translateX(-50%);
  background:var(--ink);color:#fff;font-size:12px;font-weight:600;
  padding:6px 14px;border-radius:99px;display:none;box-shadow:var(--shadow);
}
.avatar-wrap.speaking button.interrupt{display:block}

/* lesson clock under ring */
.clock{text-align:center;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.clock b{color:var(--ink);font-weight:600}

/* ══════════ STATE PILL ══════════ */
.state{
  display:flex;align-items:center;gap:8px;justify-content:center;
  padding:9px 16px;border-radius:99px;font-size:13.5px;font-weight:600;
  border:1px solid var(--line);background:var(--surface);
  transition:all .3s ease;
}
.state .dot{width:8px;height:8px;border-radius:50%}
.state[data-mode="listening"]{background:var(--live-soft);border-color:#CBE3D6;color:var(--live)}
.state[data-mode="listening"] .dot{background:var(--live);animation:pulse 1.4s infinite}
.state[data-mode="thinking"]{background:var(--think-soft);border-color:#EAD9B8;color:var(--think)}
.state[data-mode="thinking"] .dot{background:var(--think);animation:pulse .7s infinite}
.state[data-mode="speaking"]{background:var(--speak-soft);border-color:var(--sara-border);color:var(--speak)}
.state[data-mode="speaking"] .dot{background:var(--speak)}
.state[data-mode="paused"]{color:var(--muted)}
.state[data-mode="paused"] .dot{background:var(--muted)}
.state[data-mode="ended"]{background:var(--live-soft);border-color:#CBE3D6;color:var(--live)}
.state[data-mode="ended"] .dot{background:var(--live);animation:none}
button:disabled{opacity:.45;cursor:not-allowed;pointer-events:none}

/* mic level bars inside listening pill */
.bars{display:none;align-items:flex-end;gap:2px;height:12px}
.state[data-mode="listening"] .bars{display:flex}
.bars i{width:3px;background:var(--live);border-radius:2px;animation:bar 1s ease-in-out infinite}
.bars i:nth-child(1){height:5px}
.bars i:nth-child(2){height:10px;animation-delay:.15s}
.bars i:nth-child(3){height:7px;animation-delay:.3s}
@keyframes bar{0%,100%{transform:scaleY(.5)}50%{transform:scaleY(1)}}

/* ══════════ RAIL CONTROLS ══════════ */
.controls{display:flex;flex-direction:column;gap:10px;margin-top:auto}
.btn{
  display:flex;align-items:center;justify-content:center;gap:8px;
  padding:12px 16px;border-radius:var(--radius);font-size:14px;font-weight:600;
  border:1px solid var(--line);background:var(--surface);color:var(--ink);
  transition:background .15s ease;
}
.btn:hover{background:#FAF8F3}
.btn.mic[aria-pressed="true"]{background:var(--live-soft);border-color:#CBE3D6;color:var(--live)}
.btn.end{color:var(--danger)}
.btn.end.confirm{background:#FBEFEA;border-color:#EFD4CA}
.hint{font-size:12px;color:var(--muted);text-align:center}

/* ══════════ TRANSCRIPT ══════════ */
.transcript{
  flex:1;overflow-y:auto;padding:28px 32px 16px;
  display:flex;flex-direction:column;gap:16px;scroll-behavior:smooth;
}
.msg{max-width:640px;display:flex;flex-direction:column;gap:4px}
.msg .who{font-size:11px;color:var(--muted);font-weight:500;letter-spacing:.02em}
.msg.felix{align-self:flex-end;align-items:flex-end}
.msg.sara{align-self:flex-start}
.bubble{
  padding:11px 15px;border-radius:var(--radius);font-size:15px;
  box-shadow:var(--shadow);
}
.msg.felix .bubble{background:var(--felix-bubble);border:1px solid var(--line);border-bottom-right-radius:4px}
.msg.sara .bubble{background:var(--sara-bubble);border:1px solid var(--sara-border);border-bottom-left-radius:4px;color:#1D2B45}
.bubble b{color:var(--sara);font-weight:700}
.msg.partial .bubble{color:var(--muted);font-style:italic;background:transparent;border-style:dashed;box-shadow:none}

/* streaming caret */
.caret{display:inline-block;width:2px;height:1em;background:var(--sara);vertical-align:-2px;animation:pulse .8s infinite}

/* gloss + replay row inside Sara bubble */
.meta{
  display:flex;flex-wrap:wrap;align-items:center;gap:8px;
  margin-top:9px;padding-top:9px;border-top:1px solid var(--sara-border);
}
.chip{
  display:inline-flex;align-items:center;gap:6px;
  font-size:12.5px;font-weight:500;color:#4A5A78;
}
.chip .tag{
  font-size:10px;font-weight:700;background:#fff;border:1px solid var(--sara-border);
  border-radius:5px;padding:1px 5px;color:var(--sara);
}
.replay{
  display:inline-flex;align-items:center;gap:5px;
  font-size:12.5px;font-weight:600;color:var(--sara);
  padding:3px 10px;border-radius:99px;border:1px solid var(--sara-border);background:#fff;
}
.replay:hover{background:var(--sara-bubble)}

/* new-message jump pill */
.jump{
  position:absolute;bottom:88px;left:50%;transform:translateX(-50%);
  background:var(--ink);color:#fff;font-size:12.5px;font-weight:600;
  padding:7px 14px;border-radius:99px;box-shadow:var(--shadow);display:none;
}

/* ══════════ COMPOSER ══════════ */
.composer{
  display:flex;gap:10px;align-items:center;
  padding:14px 32px 18px;border-top:1px solid var(--line);
}
.composer input{
  flex:1;padding:12px 16px;border-radius:99px;
  border:1px solid var(--line);background:var(--surface);
  font-family:inherit;font-size:14px;color:var(--ink);
}
.composer input::placeholder{color:var(--muted)}
.composer .send{
  width:44px;height:44px;border-radius:50%;flex-shrink:0;
  background:var(--sara);color:#fff;font-size:16px;
  display:flex;align-items:center;justify-content:center;
}

/* ══════════ MOBILE ══════════ */
.mob-head{display:none}
.mob-bar{display:none}
@media (max-width:900px){
  .rail{display:none}
  .mob-head{
    display:flex;align-items:center;gap:12px;
    padding:12px 16px;border-bottom:1px solid var(--line);
  }
  .mob-head .avatar-wrap{width:52px;height:52px;margin:0}
  .mob-head .avatar{inset:4px}
  .mob-head .avatar span{font-size:20px}
  .mob-head .ring circle{stroke-width:3}
  .mob-head .name{font-family:'Playfair Display',serif;font-size:19px;font-weight:700}
  .mob-head .sub{font-size:11.5px;color:var(--muted)}
  .mob-head .state{margin-left:auto;padding:6px 12px;font-size:12px}
  .transcript{padding:18px 14px 12px}
  .composer{display:none}
  .mob-bar{
    display:flex;flex-direction:column;gap:10px;align-items:center;
    padding:10px 16px calc(14px + env(safe-area-inset-bottom));
    border-top:1px solid var(--line);
  }
  .mob-bar .row{display:flex;align-items:center;gap:14px;width:100%;justify-content:center}
  /* PRIMARY = mic. Big, center, thumb zone. */
  .mob-mic{
    width:72px;height:72px;border-radius:50%;
    background:var(--live);color:#fff;font-size:26px;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 4px 18px rgba(46,125,91,.35);
    transition:background .2s ease;
  }
  .mob-mic[aria-pressed="false"]{background:var(--muted);box-shadow:var(--shadow)}
  /* SECONDARY on the sides */
  .mob-side{
    width:48px;height:48px;border-radius:50%;
    border:1px solid var(--line);background:var(--surface);
    display:flex;align-items:center;justify-content:center;font-size:17px;color:var(--muted);
  }
  .mob-end{font-size:13px;font-weight:600;color:var(--danger);padding:4px 10px}
  .mob-end.confirm{background:#FBEFEA;border-radius:99px}
  .mob-text{display:none;width:100%;gap:8px}
  .mob-text.open{display:flex}
  .mob-text input{flex:1;padding:11px 14px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-family:inherit;font-size:14px}
}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}

/* ══════════ LESSON COMPLETED ══════════ */
/* Ring stays the static progress arc only — no ripple/animation here either. */
.avatar-wrap.completed .fill{stroke:var(--live)}
.clock.completed-clock{color:var(--live);font-weight:600}
</style>
</head>

<script>
/* ─── Production wiring — maps 1:1 to real WS events from /ws/session:
   partial_transcript → listening (interim Felix bubble)
   user_transcript     → thinking (final Felix bubble committed, new turn starts)
   assistant_delta     → speaking (Sara bubble streams in, first delta of turn)
   binary frame        → decoded + scheduled via the Web Audio scheduler
   turn_complete       → Sara bubble finalized; returns to listening once the
                          already-queued audio for this turn finishes playing
   corrections         → correction chip appended to the matching Sara bubble
   lesson_completed    → ring pulse + clock text updated
   status/error        → reconnect banner / inline error
   ───────────────────────────────────────────────────────────────────────── */

const CIRC = 2 * Math.PI * 102;                    // ring circumference
const LESSON = 20 * 60;                            // ring denominates a 20-min session
let elapsed = 0;

const $ = id => document.getElementById(id);
const ringD = $('ringFill'), ringM = document.querySelector('.ring-fill-m');
[ringD, ringM].forEach(r => { if (r) r.style.strokeDasharray = CIRC; });

function setRing(sec){
  const off = CIRC * (1 - Math.min(sec / LESSON, 1));
  [ringD, ringM].forEach(r => { if (r) r.style.strokeDashoffset = off; });
  const mm = String(Math.floor(sec/60)).padStart(2,'0'), ss = String(sec%60).padStart(2,'0');
  $('clockNow').textContent = `${mm}:${ss}`; $('clockNowM').textContent = `${mm}:${ss}`;
}
setRing(elapsed);
let clockTimer = setInterval(() => setRing(++elapsed), 1000);
let lessonCompleted = false;

const LABELS = { listening:'Слушаю', thinking:'Думаю…', speaking:'Говорю', paused:'Пауза', ended:'Урок завершён' };
let mode = 'paused';
function setState(m){
  mode = m;
  ['statePill','statePillM'].forEach(id => { const el = $(id); if (el) el.dataset.mode = m; });
  $('stateLabel').textContent = LABELS[m]; $('stateLabelM').textContent = LABELS[m];
  ['avatarWrap','avatarWrapM'].forEach(id => { const el = $(id); if (el) el.classList.toggle('speaking', m === 'speaking'); });
  // Ended is terminal — exactly one coherent control may show: disable the
  // mic toggle and any bars so no other control can look interactive once
  // the lesson is truly over (fix for the Пауза/«Урок завершён» conflict).
  if (m === 'ended') {
    ['micBtn','micBtnM'].forEach(id => { const el = $(id); if (el) el.disabled = true; });
    const bars = document.querySelectorAll('.state .bars');
    bars.forEach(b => b.style.display = 'none');
  }
}

const WS_URL = `${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/ws/session`;

/* ══════════ AUDIO SCHEDULER (ported verbatim from Phase-1 test page) ══════════ */
let ws = null;
let audioCtx = null;
let mediaStream = null;
let processor = null;
let playChain = Promise.resolve();
let pingInterval = null;
let nextPlayAt = 0;
let activeSources = [];

async function ensureAudioCtx() {
  if (!audioCtx || audioCtx.state === "closed") {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === "suspended") await audioCtx.resume();
}

/* Single mechanism for both barge-in and new-turn audio cancellation.
   Incrementing audioGeneration makes every in-flight enqueueAudio callback
   stale at both its pre-decode and post-decode check points. */
function invalidateAudio(){
  audioGeneration += 1;
  activeSources.forEach(s => { try { s.stop(); } catch {} });
  activeSources = [];
  nextPlayAt = audioCtx ? audioCtx.currentTime : 0;
  playChain = Promise.resolve();
}

async function enqueueAudio(arrayBuffer, turnIdx, gen) {
  // Pre-decode generation check: cheap skip before the async decode.
  if (gen !== audioGeneration) return;
  await ensureAudioCtx();
  try {
    const decoded = await audioCtx.decodeAudioData(arrayBuffer);
    // Post-decode generation check: decodeAudioData is the race window —
    // invalidateAudio() (via user_transcript or bargeIn) can fire while decode
    // is in progress, incrementing audioGeneration. If so, discard this chunk.
    if (gen !== audioGeneration) return;
    const src = audioCtx.createBufferSource();
    src.buffer = decoded;
    src.connect(audioCtx.destination);
    // Guard against clock drift / long silence between turns.
    nextPlayAt = Math.max(nextPlayAt, audioCtx.currentTime);
    src.start(nextPlayAt);
    nextPlayAt += decoded.duration;
    activeSources.push(src);
    src.onended = () => { activeSources = activeSources.filter(s => s !== src); };
    if (turnIdx != null) {
      (replayBuffers[turnIdx] || (replayBuffers[turnIdx] = [])).push(decoded);
    }
  } catch (e) {
    console.warn("Audio decode error:", e);
  }
}

// ── Microphone capture (PCM16, 16kHz mono) — ported verbatim ────────────────
async function startMic() {
  mediaStream = await navigator.mediaDevices.getUserMedia({ audio: { sampleRate: 16000, channelCount: 1, echoCancellation: true, noiseSuppression: true, autoGainControl: true } });
  audioCtx = new AudioContext({ sampleRate: 16000 });
  const source = audioCtx.createMediaStreamSource(mediaStream);
  processor = audioCtx.createScriptProcessor(4096, 1, 1);

  processor.onaudioprocess = e => {
    if (!micEnabled || !ws || ws.readyState !== WebSocket.OPEN) return;
    const float32 = e.inputBuffer.getChannelData(0);
    const pcm16 = float32ToPcm16(float32);
    ws.send(pcm16);
  };

  source.connect(processor);
  processor.connect(audioCtx.destination);
}

function float32ToPcm16(float32) {
  const buf = new ArrayBuffer(float32.length * 2);
  const view = new DataView(buf);
  for (let i = 0; i < float32.length; i++) {
    const s = Math.max(-1, Math.min(1, float32[i]));
    view.setInt16(i * 2, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
  }
  return buf;
}

function stopMic() {
  if (processor) { processor.disconnect(); processor = null; }
  if (mediaStream) { mediaStream.getTracks().forEach(t => t.stop()); mediaStream = null; }
}

/* ══════════ TRANSCRIPT RENDERING ══════════ */
const transcriptEl = $('transcript');
let partialEl = null;
let currentSaraEl = null;
let currentTurnIndex = 0;
let audioGeneration = 0;         // incremented by invalidateAudio(); captured per binary chunk
const replayBuffers = {};        // turnIndex -> [AudioBuffer, ...]
let replayNextAt = 0;

function scrollToBottom(){ transcriptEl.scrollTop = transcriptEl.scrollHeight; }

function upsertPartial(text){
  if (!partialEl){
    partialEl = document.createElement('div');
    partialEl.className = 'msg felix partial';
    partialEl.innerHTML = '<span class="who">Феликс</span><div class="bubble"></div>';
    transcriptEl.appendChild(partialEl);
  }
  partialEl.querySelector('.bubble').textContent = text;
  scrollToBottom();
}

function commitFelixTurn(text){
  if (partialEl) { partialEl.remove(); partialEl = null; }
  const m = document.createElement('div');
  m.className = 'msg felix';
  m.innerHTML = `<span class="who">Феликс</span><div class="bubble"></div>`;
  m.querySelector('.bubble').textContent = text;
  transcriptEl.appendChild(m);
  scrollToBottom();
}

function startSaraTurn(turnIdx){
  const m = document.createElement('div');
  m.className = 'msg sara';
  m.dataset.turnIndex = turnIdx;
  m.innerHTML = '<span class="who">Sara</span><div class="bubble"><span class="stream"></span><span class="caret"></span></div>';
  transcriptEl.appendChild(m);
  scrollToBottom();
  return m;
}

function appendSaraDelta(text){
  if (!currentSaraEl) currentSaraEl = startSaraTurn(currentTurnIndex);
  const target = currentSaraEl.querySelector('.stream');
  target.textContent += text;
  scrollToBottom();
}

function finalizeSaraTurn(){
  if (!currentSaraEl) return;
  const caret = currentSaraEl.querySelector('.caret');
  if (caret) caret.remove();
  currentSaraEl = null;
}

function attachCorrections(turnIdx, errors){
  const el = transcriptEl.querySelector(`.msg.sara[data-turn-index="${turnIdx}"]`);
  if (!el || !errors || !errors.length) return;
  const bubble = el.querySelector('.bubble');
  let meta = bubble.querySelector('.meta');
  if (!meta) {
    meta = document.createElement('div');
    meta.className = 'meta';
    bubble.appendChild(meta);
  }
  errors.forEach(err => {
    const chip = document.createElement('span');
    chip.className = 'chip';
    const gloss = err.explanation_ru || `«${err.original || ''}» → «${err.correction || ''}»`;
    chip.innerHTML = `<span class="tag">RU</span> ${gloss}`;
    meta.appendChild(chip);
  });
  const replay = document.createElement('button');
  replay.className = 'replay';
  replay.textContent = '▶ Прослушать снова';
  replay.addEventListener('click', () => replayTurnAudio(turnIdx));
  meta.appendChild(replay);
  highlightRecast(bubble, errors);
}

/* ── Recast highlighting (mirrors the Telegram bot's word-diff bolding) ──────
   For each correction, word-diff `original` vs `correction` and bold the
   words that changed/were added in Sara's own bubble text. Client-side only,
   operates strictly on the .stream text nodes (never touches .meta chips),
   never double-wraps, silently skips words that don't appear verbatim (Sara
   paraphrased), and is fully isolated in try/catch so a bug here can never
   break the transcript. */
function wordTokens(str){
  return (str || '').split(/\s+/).filter(Boolean);
}
function normWord(w){
  return w.toLowerCase().replace(/^[^\w']+|[^\w']+$/g, '');
}
function lcsChangedWords(originalWords, correctionWords){
  const a = originalWords.map(normWord);
  const b = correctionWords.map(normWord);
  const n = a.length, m = b.length;
  const dp = Array.from({ length: n + 1 }, () => new Array(m + 1).fill(0));
  for (let i = n - 1; i >= 0; i--){
    for (let j = m - 1; j >= 0; j--){
      dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
    }
  }
  const bInLcs = new Set();
  let i = 0, j = 0;
  while (i < n && j < m){
    if (a[i] === b[j]) { bInLcs.add(j); i++; j++; }
    else if (dp[i + 1][j] >= dp[i][j + 1]) i++;
    else j++;
  }
  const changed = [];
  for (let k = 0; k < m; k++){
    if (!bInLcs.has(k) && b[k]) changed.push(b[k]);
  }
  return changed;
}
function highlightRecast(bubbleEl, errors){
  try {
    const streamEl = bubbleEl.querySelector('.stream');
    if (!streamEl || !errors || !errors.length) return;
    const targetWords = new Set();
    errors.forEach(err => {
      lcsChangedWords(wordTokens(err.original || ''), wordTokens(err.correction || ''))
        .forEach(w => targetWords.add(w));
    });
    if (!targetWords.size) return;
    const escaped = Array.from(targetWords).map(w => w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
    const pattern = new RegExp('\\b(' + escaped.join('|') + ')\\b', 'gi');

    const walker = document.createTreeWalker(streamEl, NodeFilter.SHOW_TEXT, null);
    const textNodes = [];
    let node;
    while ((node = walker.nextNode())) {
      if (node.parentElement && node.parentElement.closest('b')) continue;
      textNodes.push(node);
    }
    textNodes.forEach(n => {
      const text = n.nodeValue;
      pattern.lastIndex = 0;
      if (!pattern.test(text)) return;
      pattern.lastIndex = 0;
      const frag = document.createDocumentFragment();
      let lastIndex = 0, m;
      while ((m = pattern.exec(text))) {
        if (m.index > lastIndex) frag.appendChild(document.createTextNode(text.slice(lastIndex, m.index)));
        const b = document.createElement('b');
        b.textContent = m[0];
        frag.appendChild(b);
        lastIndex = m.index + m[0].length;
        if (m.index === pattern.lastIndex) pattern.lastIndex++;
      }
      if (lastIndex < text.length) frag.appendChild(document.createTextNode(text.slice(lastIndex)));
      n.parentNode.replaceChild(frag, n);
    });
  } catch (e) {
    console.warn('[Recast] highlight failed (non-fatal):', e);
  }
}

async function replayTurnAudio(turnIdx){
  const buffers = replayBuffers[turnIdx];
  if (!buffers || !buffers.length) return;
  await ensureAudioCtx();
  replayNextAt = Math.max(replayNextAt, audioCtx.currentTime);
  buffers.forEach(buf => {
    const src = audioCtx.createBufferSource();
    src.buffer = buf;
    src.connect(audioCtx.destination);
    src.start(replayNextAt);
    replayNextAt += buf.duration;
  });
}

/* ══════════ WEBSOCKET ══════════ */
let micEnabled = true;
let reconnectAttempted = false;
let sessionEnded = false;

function showBanner(text){ $('bannerText').textContent = text; $('banner').classList.add('show'); }
function hideBanner(){ $('banner').classList.remove('show'); }
$('bannerClose').addEventListener('click', hideBanner);

/* Beat 1 (greeting video) — rule 3 safety: any failure here (missing
   file, decode error, autoplay block, or 'ended' just never firing)
   must silently fall back to the static portrait AND still let the
   welcome turn fire — Felix must never be left with no greeting.

   Sequencing: the beat's own audio and the server's welcome-turn TTS
   used to fire simultaneously (two overlapping Clarice voices) because
   the client sent WS "start" — which the server gates the welcome
   turn behind (see app.py's `if not welcome_sent[0]`) — at the same
   moment it kicked off the beat. Fix: delay sending "start" until the
   beat resolves (ended / error / autoplay-blocked / timeout), via a
   single fired-once guard (`welcomeGateFired`) shared by all four exit
   paths so a race between 'ended' and the timeout can't double-fire. */
let welcomeGateFired = false;
let beatTimeoutId = null;
const BEAT_MAX_WAIT_MS = 8000;

function revertToPortrait(){
  try {
    const v = $('beatVideo');
    if (!v) return;
    v.pause();
    v.style.display = 'none';
    v.removeAttribute('src');
    v.load();
  } catch (err) { console.warn('[Beat] revertToPortrait failed (non-fatal):', err); }
}

/* Generic beat player — same play/revert/fallback mechanism used by the
   greeting beat (Part 1 spec: reuse exactly, don't invent a new one).
   `src` is the only thing that varies between beats; `onDone` fires
   exactly once via the same onended/onerror/autoplay-catch/try-catch
   paths already proven out for the greeting beat. */
function playBeat(src, onDone){
  const proceed = () => { try { onDone(); } catch (err) { console.error('[Beat] onDone callback failed:', err); } };
  try {
    const v = $('beatVideo');
    if (!v) { proceed(); return; }
    v.onended = () => { revertToPortrait(); proceed(); };
    v.onerror = () => {
      console.warn('[Beat] video error — falling back to portrait');
      revertToPortrait(); proceed();
    };
    v.src = src;
    v.style.display = 'block';
    v.currentTime = 0;
    const playPromise = v.play();
    if (playPromise && typeof playPromise.catch === 'function') {
      playPromise.catch(err => {
        console.warn('[Beat] autoplay blocked/failed — falling back to portrait:', err);
        revertToPortrait(); proceed();
      });
    }
  } catch (err) {
    console.warn('[Beat] playBeat failed (non-fatal):', err);
    revertToPortrait(); proceed();
  }
}

/* Beat 1 entry point — unchanged behavior/signature, now backed by the
   generic playBeat() above instead of its own duplicated body. */
function playGreetingBeat(onDone){
  playBeat('/static/beats/beat_greeting.mp4', onDone);
}

function connect(){
  ws = new WebSocket(WS_URL);
  ws.binaryType = 'arraybuffer';

  function fireWelcomeTurn(){
    if (welcomeGateFired) return;
    welcomeGateFired = true;
    if (beatTimeoutId) { clearTimeout(beatTimeoutId); beatTimeoutId = null; }
    hideBanner();
    reconnectAttempted = false;
    ws.send(JSON.stringify({ type: 'start', sample_rate: 16000 }));
    setState(micEnabled ? 'listening' : 'paused');
    pingInterval = setInterval(() => {
      if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: 'ping' }));
    }, 20000);
  }

  ws.onopen = () => {
    welcomeGateFired = false;
    // Max-timeout fallback (rule 3): if 'ended' never fires (stalled
    // decode, tab-throttled background timer, etc.), the welcome turn
    // still must not be dropped — fireWelcomeTurn()'s own guard makes
    // this safe to race against the beat's own completion callback.
    beatTimeoutId = setTimeout(() => {
      console.warn('[Beat] max-wait timeout — firing welcome turn without further delay');
      revertToPortrait();
      fireWelcomeTurn();
    }, BEAT_MAX_WAIT_MS);
    playGreetingBeat(fireWelcomeTurn);
  };

  ws.onclose = e => {
    if (pingInterval) { clearInterval(pingInterval); pingInterval = null; }
    if (sessionEnded) return;
    if (!e.wasClean && !reconnectAttempted) {
      reconnectAttempted = true;
      showBanner('Связь прервалась — переподключаюсь…');
      setTimeout(() => { if (!sessionEnded) connect(); }, 2000);
    } else if (!e.wasClean) {
      showBanner('Связь потеряна. Обновите страницу, чтобы продолжить.');
    }
  };

  ws.onerror = () => console.error('[WS] error');

  ws.onmessage = e => {
    if (e.data instanceof ArrayBuffer) {
      if (e.data.byteLength > 0) {
        const buf = e.data.slice(0);
        const turnIdx = currentTurnIndex;
        const gen = audioGeneration;
        playChain = playChain
            .then(() => enqueueAudio(buf, turnIdx, gen))
            .catch(err => console.error('audio chunk failed:', err));
      }
      return;
    }
    let msg;
    try { msg = JSON.parse(e.data); } catch { return; }

    switch (msg.type) {
      case 'partial_transcript':
        if (mode !== 'thinking' && mode !== 'speaking') upsertPartial(msg.text);
        break;
      case 'user_transcript':
        currentTurnIndex += 1;
        // Under half-duplex, a committed transcript while old audio plays means
        // the user talked over the tail — treat it as an interruption and cut
        // the tail. invalidateAudio() is the single mechanism for both barge-in
        // and new-turn audio cancellation.
        invalidateAudio();
        commitFelixTurn(msg.text);
        currentSaraEl = null;
        setState('thinking');
        break;
      case 'assistant_delta':
        if (mode !== 'speaking') setState('speaking');
        appendSaraDelta(msg.text);
        break;
      case 'turn_complete': {
        finalizeSaraTurn();
        const turnAtComplete = currentTurnIndex;
        playChain = playChain.then(() => {
          if (currentTurnIndex === turnAtComplete && mode === 'speaking') {
            setState(micEnabled ? 'listening' : 'paused');
          }
        });
        break;
      }
      case 'corrections':
        attachCorrections(msg.turn_index, msg.errors);
        break;
      case 'lesson_completed':
        if (!lessonCompleted) {
          lessonCompleted = true;
          ['avatarWrap', 'avatarWrapM'].forEach(id => { const el = $(id); if (el) el.classList.add('completed'); });
          const clockBox = $('clockNow').closest('.clock');
          if (clockBox) { clockBox.classList.add('completed-clock'); clockBox.lastChild.textContent = ' ✓ урок засчитан'; }
          const subBox = $('clockNowM').closest('.sub');
          if (subBox) subBox.insertAdjacentHTML('beforeend', ' · <span style="color:var(--live);font-weight:600">✓ засчитан</span>');
        }
        break;
      case 'status':
        showBanner(msg.message || 'переподключение…');
        break;
      case 'error':
        showBanner(msg.message || 'Ошибка соединения');
        break;
    }
  };
}

function endSession(){
  sessionEnded = true;
  if (clockTimer) clearInterval(clockTimer);
  if (ws) { try { ws.send(JSON.stringify({ type: 'end_session' })); } catch {} ws.close(1000); ws = null; }
  stopMic();
}

/* ══════════ CONTROLS ══════════ */

/* barge-in: client-side only — stop local playback for the in-flight turn and
   return the UI to listening. Never sends anything to the server; §11
   server-side turn gating is untouched, so the server keeps generating/
   sending audio for this turn until it completes on its own. */
function bargeIn(){
  if (mode !== 'speaking') return;
  invalidateAudio();
  finalizeSaraTurn();
  setState(micEnabled ? 'listening' : 'paused');
}
$('interruptBtn').addEventListener('click', bargeIn);

/* Pause/Resume control — mic-toggle IS the pause affordance (mic off =
   paused), but audit found it was labeled purely as an audio-input toggle
   ("Микрофон выключен"), so users never perceived it as a pause control.
   Relabeled here to explicit Пауза/Продолжить semantics; underlying
   mechanism (micEnabled flag) unchanged. Visible + enabled in every active
   state (listening/thinking/speaking); disabled only once truly 'ended'. */
function updateHint(){
  const el = $('hintText');
  if (!el) return;
  el.innerHTML = micEnabled
    ? 'Говорите — Sara слушает и отвечает.<br>Нажмите «Пауза», чтобы приостановить.'
    : 'Микрофон выключен — Sara не слышит.<br>Нажмите «Продолжить», чтобы возобновить урок.';
}

function bindMic(btn, hasLabel){
  btn.addEventListener('click', () => {
    micEnabled = !micEnabled;
    btn.setAttribute('aria-pressed', micEnabled);
    if (hasLabel) btn.textContent = micEnabled ? '⏸ Пауза' : '▶ Продолжить';
    btn.setAttribute('aria-label', micEnabled ? 'Пауза' : 'Продолжить');
    updateHint();
    if (mode === 'listening' || mode === 'paused') setState(micEnabled ? 'listening' : 'paused');
  });
}
bindMic($('micBtn'), true); bindMic($('micBtnM'), false);

/* end lesson — two-step confirm, never one tap */
function bindEnd(btn){
  let armed = false, timer;
  btn.addEventListener('click', () => {
    if (sessionEnded) return;
    if (!armed){
      armed = true; btn.classList.add('confirm');
      btn.textContent = 'Ещё раз — завершить?';
      timer = setTimeout(() => { armed = false; btn.classList.remove('confirm');
        btn.textContent = btn.id === 'endBtn' ? 'Завершить урок' : 'Завершить'; }, 3500);
    } else {
      clearTimeout(timer);
      btn.textContent = 'Урок завершён ✓'; btn.classList.remove('confirm');
      // Terminal state — distinct from a mic-off pause, so the state pill
      // and the end button never contradict each other at session end.
      setState('ended');
      // Finish-with-credit send-off (Part 2): fires only when this two-tap
      // end coincides with status=='completed' — tracked by the existing
      // `lessonCompleted` flag, set earlier by the 'lesson_completed' WS
      // message (the silent 10-min-credit flip). That flip itself never
      // plays a beat mid-lesson (rule: never interrupt a live lesson) —
      // only this explicit end action does, and only if credit was
      // already earned. Early exit before credit → lessonCompleted is
      // still false here → no complete beat. No following audio turn, so
      // no sequencing guard is needed — just play, then close as normal.
      if (lessonCompleted) {
        playBeat('/static/beats/beat_complete.mp4', () => {});
      }
      endSession();
      ['endBtn','endBtnM'].forEach(id => { const el = $(id); if (el) el.disabled = true; });
    }
  });
}
bindEnd($('endBtn')); bindEnd($('endBtnM'));

/* mobile keyboard toggle */
$('kbBtn').addEventListener('click', () => $('mobText').classList.toggle('open'));

/* text composer — desktop + mobile, same text_turn WS message */
function sendTextTurn(input){
  const text = (input.value || '').trim();
  if (!text || !ws || ws.readyState !== WebSocket.OPEN) return;
  ws.send(JSON.stringify({ type: 'text_turn', text }));
  input.value = '';
}
document.querySelectorAll('.composer, .mob-text').forEach(row => {
  const input = row.querySelector('input');
  const send = row.querySelector('.send');
  if (!input || !send) return;
  send.addEventListener('click', () => sendTextTurn(input));
  input.addEventListener('keydown', e => { if (e.key === 'Enter') sendTextTurn(input); });
});

/* new-message jump pill */
transcriptEl.addEventListener('scroll', () => {
  const atBottom = transcriptEl.scrollHeight - transcriptEl.scrollTop - transcriptEl.clientHeight < 40;
  $('jumpBtn').style.display = atBottom ? 'none' : 'block';
});
$('jumpBtn').addEventListener('click', () => { scrollToBottom(); $('jumpBtn').style.display = 'none'; });

/* ══════════ BOOT ══════════ */
(async function boot(){
  try {
    await startMic();
    connect();
  } catch (e) {
    console.error('Mic permission / init failed:', e);
    showBanner('Нет доступа к микрофону — разрешите доступ и обновите страницу.');
  }
})();

window.addEventListener('beforeunload', () => { if (!sessionEnded) endSession(); });
</script>
