services:
  - type: web
    name: gradus-media-ai
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: FACEBOOK_PAGE_ACCESS_TOKEN
        sync: false
      - key: FACEBOOK_PAGE_ID
        sync: false
      - key: LINKEDIN_ACCESS_TOKEN
        sync: false
      - key: LINKEDIN_ORGANIZATION_URN
        sync: false
      - key: APP_URL
        sync: false
      - key: SARA_INTERNAL_TOKEN
        sync: false
    healthCheckPath: /health

  - type: web
    name: sara-english
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    # Override CMD to start the real-time service from backend/ (same import
    # root as the main service — services.sara_prompts resolves correctly).
    dockerCommand: bash -c "cd backend && exec uvicorn sara_realtime.app:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: SARA_RT_VOICE_ID
        sync: false
      - key: SARA_RT_STT_MODEL
        sync: false
      - key: SARA_RT_TTS_MODEL
        sync: false
      - key: SARA_RT_ACCESS_TOKEN
        sync: false
      - key: MAIN_BACKEND_URL
        sync: false
      - key: SARA_INTERNAL_TOKEN
        sync: false
